name: Package smoke
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  wheel:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build
      - name: Install wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/yadro-venv"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$RUNNER_TEMP/yadro-venv/Scripts/python.exe"; BIN="$RUNNER_TEMP/yadro-venv/Scripts"; else PY="$RUNNER_TEMP/yadro-venv/bin/python"; BIN="$RUNNER_TEMP/yadro-venv/bin"; fi
          "$PY" -m pip install --disable-pip-version-check dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/yadro-guard" --version
          "$BIN/yadro-guard" version
          "$BIN/yadro-guard" mcp scan "$GITHUB_WORKSPACE/tests/fixtures/mcp-clean.json" --format json
