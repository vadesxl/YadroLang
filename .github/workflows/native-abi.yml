name: Native ABI smoke
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - id: native
        continue-on-error: true
        shell: bash
        run: python -m unittest tests.test_native_abi -v > native.log 2>&1
      - if: steps.native.outcome == 'failure' && github.event_name == 'pull_request' && matrix.os == 'windows-latest'
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          { echo 'Windows native ABI failure:'; echo '```text'; cat native.log; echo '```'; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
      - if: steps.native.outcome == 'failure'
        shell: bash
        run: cat native.log && exit 1
