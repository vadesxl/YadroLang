name: YADRO CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: LLVM IR
        run: python -m src.main examples/тест.яд --ir

      - name: Нативная сборка и запуск
        run: |
          python -m src.main examples/тест.яд
          cc ядро.o -o ядро
          echo "=== Запуск нативного бинаря YadroLang ==="
          ./ядро

      - name: Этичный экспорт компилируется
        run: python -m src.main examples/безопасный.яд --ir

      - name: Блокировка - нет мандата
        run: |
          if python -m src.main examples/опасный.яд; then
            echo "ПРОВАЛ: код без мандата скомпилировался!"; exit 1
          else echo "OK: мандат обязателен."; fi

      - name: Блокировка - утечка личных данных
        run: |
          if python -m src.main examples/утечка.яд; then
            echo "ПРОВАЛ: утечка скомпилировалась!"; exit 1
          else echo "OK: taint заблокировал утечку."; fi

      - name: Блокировка - утечка через инициализатор
        run: |
          if python -m src.main examples/утечка_в_присвоении.яд; then
            echo "ПРОВАЛ: утечка в присвоении прошла!"; exit 1
          else echo "OK: taint поймал утечку в инициализаторе."; fi

      - name: Блокировка - утечка через цикл с 0 итераций
        run: |
          if python -m src.main examples/утечка_в_цикле.яд; then
            echo "ПРОВАЛ: утечка через цикл прошла!"; exit 1
          else echo "OK: taint сохраняется в необязательном цикле."; fi

      - name: Блокировка - межпроцедурная утечка через параметр
        run: |
          if python -m src.main examples/эксплойт_параметр.яд; then
            echo "ПРОВАЛ: утечка через параметр прошла!"; exit 1
          else echo "OK: межпроцедурная утечка поймана."; fi

      - name: Блокировка - двойная косвенность
        run: |
          if python -m src.main examples/edge_двойная.яд; then
            echo "ПРОВАЛ: утечка через два уровня прошла!"; exit 1
          else echo "OK: транзитивная утечка поймана."; fi

      - name: Блокировка - сток в условии если
        run: |
          if python -m src.main examples/codex_условие.яд; then
            echo "ПРОВАЛ: утечка в условии прошла!"; exit 1
          else echo "OK: сток в условии пойман."; fi

      - name: Блокировка - утечка при цикле с 0 итераций
        run: |
          if python -m src.main examples/codex_цикл0.яд; then
            echo "ПРОВАЛ: утечка при нулевом цикле прошла!"; exit 1
          else echo "OK: taint параметра сохранён."; fi

      - name: Приёмка - заражённое в не-протекающий параметр компилируется
        run: python -m src.main examples/edge_безопасный_параметр.яд --ir

      - name: Приёмка - санитайзенное через параметр компилируется
        run: python -m src.main examples/edge_санитайзер.яд --ir
