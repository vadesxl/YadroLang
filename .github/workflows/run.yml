name: YADRO CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: LLVM IR
        run: python -m src.main examples/тест.яд --ir

      - name: Нативная сборка и запуск
        run: |
          python -m src.main examples/тест.яд
          cc ядро.o -o ядро
          echo "=== Запуск нативного бинаря YadroLang ==="
          ./ядро

      - name: Этичный экспорт компилируется
        run: python -m src.main examples/безопасный.яд --ir

      - name: Блокировка - нет мандата
        run: |
          if python -m src.main examples/опасный.яд; then
            echo "ПРОВАЛ: код без мандата скомпилировался!"; exit 1
          else echo "OK: мандат обязателен."; fi

      - name: Блокировка - утечка личных данных
        run: |
          if python -m src.main examples/утечка.яд; then
            echo "ПРОВАЛ: утечка скомпилировалась!"; exit 1
          else echo "OK: taint заблокировал утечку."; fi

      - name: Блокировка - утечка через инициализатор
        run: |
          if python -m src.main examples/утечка_в_присвоении.яд; then
            echo "ПРОВАЛ: утечка в присвоении прошла!"; exit 1
          else echo "OK: taint поймал утечку в инициализаторе."; fi

      - name: Блокировка - утечка через цикл с 0 итераций
        run: |
          if python -m src.main examples/утечка_в_цикле.яд; then
            echo "ПРОВАЛ: утечка через цикл прошла!"; exit 1
          else echo "OK: taint сохраняется в необязательном цикле."; fi

      - name: Блокировка - межпроцедурная утечка через параметр
        run: |
          if python -m src.main examples/эксплойт_параметр.яд; then
            echo "ПРОВАЛ: утечка через параметр прошла!"; exit 1
          else echo "OK: межпроцедурная утечка поймана."; fi

      - name: Блокировка - двойная косвенность
        run: |
          if python -m src.main examples/edge_двойная.яд; then
            echo "ПРОВАЛ: утечка через два уровня прошла!"; exit 1
          else echo "OK: транзитивная утечка поймана."; fi

      - name: Блокировка - сток в условии если
        run: |
          if python -m src.main examples/codex_условие.яд; then
            echo "ПРОВАЛ: утечка в условии прошла!"; exit 1
          else echo "OK: сток в условии пойман."; fi

      - name: Блокировка - утечка при цикле с 0 итераций
        run: |
          if python -m src.main examples/codex_цикл0.яд; then
            echo "ПРОВАЛ: утечка при нулевом цикле прошла!"; exit 1
          else echo "OK: taint параметра сохранён."; fi

      - name: Приёмка - заражённое в не-протекающий параметр компилируется
        run: python -m src.main examples/edge_безопасный_параметр.яд --ir

      - name: Приёмка - санитайзенное через параметр компилируется
        run: python -m src.main examples/edge_санитайзер.яд --ir

      - name: Блокировка - подмена встроенного санитайзера (#8)
        run: |
          for f in подмена_санитайзера подмена_хэша; do
            if python -m src.main examples/$f.яд; then
              echo "ПРОВАЛ: $f скомпилировался!"; exit 1
            else echo "OK: $f заблокирован."; fi
          done

      - name: Аудит - 11 векторов должны блокироваться
        run: |
          for f in аудит_труба аудит_источник_внутри аудит_бинарный аудит_вложенный_сток аудит_мандат_глубоко аудит_алиас_оригинал аудит_цикл_накопление аудит_сток_в_условии аудит_санитайз_перетереть аудит_двойная_труба аудит_параметр_в_сток; do
            if python -m src.main examples/$f.яд; then
              echo "ПРОВАЛ: $f скомпилировался (дыра)!"; exit 1
            else echo "OK: $f заблокирован."; fi
          done

      - name: Аудит - честный санитайзер компилируется
        run: python -m src.main examples/аудит_безопасный_санитайз.яд --ir

      - name: Блокировка - валидация точки входа (3 бага)
        run: |
          for f in без_точки_входа старт_с_параметром дубль_старт; do
            if python -m src.main examples/$f.яд; then
              echo "ПРОВАЛ: $f скомпилировался!"; exit 1
            else echo "OK: $f отклонён."; fi
          done

      - name: Блокировка - семантика вызовов (4 бага)
        run: |
          for f in вызов_неизвестной арность_мало арность_много лексер_неизвестный_символ; do
            if python -m src.main examples/$f.яд; then
              echo "ПРОВАЛ: $f скомпилировался!"; exit 1
            else echo "OK: $f отклонён."; fi
          done

      - name: Блокировка - деление на ноль и переполнение i64
        run: |
          for f in деление_на_ноль переполнение_i64; do
            if python -m src.main examples/$f.яд; then
              echo "ПРОВАЛ: $f скомпилировался!"; exit 1
            else echo "OK: $f отклонён."; fi
          done

      - name: v2.0 - Block implicit flow leak
        run: |
          if python -m src.main examples/неявный_поток_утечка.яд; then
            echo "FAIL: implicit flow leak compiled!"; exit 1
          else echo "OK: implicit flow leak blocked."; fi

      - name: v2.0 - Block implicit flow nested
        run: |
          if python -m src.main examples/неявный_поток_вложенный.яд; then
            echo "FAIL: nested implicit flow compiled!"; exit 1
          else echo "OK: nested implicit flow blocked."; fi

      - name: v2.0 - Accept implicit flow safe
        run: python -m src.main examples/неявный_поток_безопасный.яд --ir

      - name: v2.0 - Block multi-label PII leak
        run: |
          if python -m src.main examples/мультиметка_пдн.яд; then
            echo "FAIL: PII multi-label leak compiled!"; exit 1
          else echo "OK: PII multi-label leak blocked."; fi

      - name: v2.0 - Block multi-label financial leak
        run: |
          if python -m src.main examples/мультиметка_финансы.яд; then
            echo "FAIL: financial multi-label leak compiled!"; exit 1
          else echo "OK: financial multi-label leak blocked."; fi

      - name: v2.0 - Block multi-label health leak
        run: |
          if python -m src.main examples/мультиметка_здоровье.яд; then
            echo "FAIL: health multi-label leak compiled!"; exit 1
          else echo "OK: health multi-label leak blocked."; fi

      - name: v2.0 - Block multi-label credentials leak
        run: |
          if python -m src.main examples/мультиметка_учетные.яд; then
            echo "FAIL: credentials multi-label leak compiled!"; exit 1
          else echo "OK: credentials multi-label leak blocked."; fi

      - name: v2.0 - Block leak chain
        run: |
          if python -m src.main examples/утечка_цепочка.яд; then
            echo "FAIL: leak chain compiled!"; exit 1
          else echo "OK: leak chain blocked."; fi

      - name: v2.0 - Block location leak
        run: |
          if python -m src.main examples/утечка_локации.яд; then
            echo "FAIL: location leak compiled!"; exit 1
          else echo "OK: location leak blocked."; fi

      - name: v2.0 - Block DB write leak
        run: |
          if python -m src.main examples/бд_запись_утечка.яд; then
            echo "FAIL: DB write leak compiled!"; exit 1
          else echo "OK: DB write leak blocked."; fi

      - name: v2.0 - Block log PII leak
        run: |
          if python -m src.main examples/лог_пдн_утечка.яд; then
            echo "FAIL: log PII leak compiled!"; exit 1
          else echo "OK: log PII leak blocked."; fi
