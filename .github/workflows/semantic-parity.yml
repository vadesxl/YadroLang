name: Semantic surface parity
on:
  pull_request:
    paths:
      - spec/semantic_surface.json
      - tools/check_parity.py
      - tests/test_semantic_parity.py
      - .github/workflows/semantic-parity.yml
  push:
    branches: [main]
    paths:
      - spec/semantic_surface.json
      - tools/check_parity.py
      - .github/workflows/semantic-parity.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: vadesxl/YadroLang-English
          ref: 522b86d7f64d476e1d7507256f02f8f9b3acffb5
          path: counterpart
          persist-credentials: false
      - name: Verify validator identity
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          local=Path("tools/check_parity.py").read_bytes()
          remote=Path("counterpart/tools/check_parity.py").read_bytes()
          if hashlib.sha256(local).digest()!=hashlib.sha256(remote).digest():
              raise SystemExit("parity validator drift: update both repositories together")
          print("validator sha256",hashlib.sha256(local).hexdigest())
      - name: Compare semantic surface contracts
        run: python tools/check_parity.py spec/semantic_surface.json counterpart/spec/semantic_surface.json
