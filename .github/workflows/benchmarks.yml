name: MVP benchmarks
on:
  pull_request:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m benchmarks.run > benchmark.json
      - run: cat benchmark.json
      - name: Publish benchmark annotation
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('benchmark.json').read_text().replace('%','%25').replace('\n','%0A').replace('\r','%0D')
          print(f'::notice title=Yadro benchmark::{text}')
          PY
